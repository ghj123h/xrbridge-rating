<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153e32">
  <meta name="description" content="查询新睿桥牌牌手等级分、历史曲线、计分对局与三大赛预测。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23153e32'/%3E%3Ctext x='20' y='30' text-anchor='middle' font-size='32' fill='%23f6edcf'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <title>牌手排行榜 · 新睿等级分</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./predictions.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="新睿等级分首页">
        <span class="brand-symbol" aria-hidden="true">♠</span><span>新睿等级分</span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="#" class="nav-link">排行榜</a>
        <a href="#predictions/monthly" class="nav-link">三大赛预测</a>
        <a href="#rules" class="nav-link">等级分规则</a>
      </nav>
      <span class="update-chip"><span class="status-dot" aria-hidden="true"></span><span id="header-update">数据加载中</span></span>
    </div>
  </header>

  <main class="site-main">
    <div id="loading-state" class="loading-state" role="status"><span class="loading-spinner" aria-hidden="true"></span>正在读取等级分…</div>
    <div id="error-state" class="error-state" role="alert" hidden>
      <p id="error-message">等级分加载失败</p><button id="retry-load" type="button" class="button button-primary">重新加载</button>
    </div>

    <section id="home-view" hidden aria-labelledby="home-title">
      <div class="home-heading">
        <h1 id="home-title">牌手排行榜</h1>
        <label class="search-field">
          <span class="search-icon" aria-hidden="true"></span>
          <span class="visually-hidden">搜索牌手昵称或历史昵称</span>
          <input id="search-input" type="search" autocomplete="off" placeholder="搜索牌手昵称或历史昵称" aria-describedby="search-status">
        </label>
      </div>
      <div class="home-layout">
        <section class="panel ranking-panel" aria-label="牌手榜单">
          <div class="board-tabs" role="group" aria-label="榜单类型">
            <button class="board-tab active" data-board="rating" type="button" aria-pressed="true">等级分榜</button>
            <button class="board-tab" data-board="gainers" type="button" aria-pressed="false">上分榜</button>
            <button class="board-tab" data-board="losers" type="button" aria-pressed="false">下分榜</button>
          </div>
          <div class="ranking-controls">
            <label class="filter-field"><span>变化周期</span>
              <select id="period-filter"><option value="1" selected>昨日</option><option value="7">近 7 日</option><option value="30">近 30 日</option></select>
            </label>
            <label class="filter-field"><span>牌手状态</span>
              <select id="status-filter"><option value="all">全部牌手</option><option value="mature" selected>成熟</option><option value="provisional">暂定</option></select>
            </label>
            <label class="filter-field"><span>活跃度</span>
              <select id="activity-filter"><option value="all">全部</option><option value="30">近 30 日活跃</option></select>
            </label>
          </div>
          <div class="ranking-summary">
            <p id="ranking-note"></p><p id="search-status" role="status"></p>
          </div>
          <div class="table-scroll" role="region" aria-label="牌手排名明细" tabindex="0">
            <table id="ranking-table" class="ranking-table">
              <thead><tr><th scope="col">排名</th><th scope="col">牌手</th><th scope="col">等级分</th><th scope="col" id="change-column">昨日变化</th><th scope="col">有效场数</th></tr></thead>
              <tbody id="ranking-body"></tbody>
            </table>
          </div>
          <div id="ranking-empty" class="empty-state" hidden>没有符合条件的牌手</div>
          <div class="pagination ranking-pagination">
            <span id="page-label"></span>
            <div class="page-controls">
              <button id="prev-page" type="button" class="pagination-button" aria-label="上一页">←</button>
              <button id="next-page" type="button" class="pagination-button" aria-label="下一页">→</button>
              <form id="page-jump" class="page-jump">
                <label for="page-number">跳至</label><input id="page-number" type="number" min="1" step="1" value="1" aria-label="跳转页码"><button type="submit" class="pagination-button">跳转</button>
              </form>
            </div>
          </div>
        </section>
        <aside class="stats-rail" aria-label="全站统计">
          <details id="site-overview" open>
            <summary><h2>全站概览</h2><span class="disclosure-mark" aria-hidden="true"></span></summary>
            <div id="site-stats" class="stats-grid"></div>
          </details>
        </aside>
      </div>
    </section>

    <section id="player-view" hidden>
      <div class="profile-navigation">
        <button id="back-home" type="button" class="text-button">← 返回榜单</button>
        <button id="copy-link" type="button" class="button button-secondary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 15 6-6m-6 4-2 2a3.5 3.5 0 0 0 5 5l3-3m0-6 2-2a3.5 3.5 0 0 0-5-5L9 7"/></svg>复制个人链接
        </button>
      </div>
      <header id="player-heading" class="profile-header"></header>
      <div id="player-overview" class="overview-grid"></div>
      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="panel-heading"><div><h2 id="chart-title">等级分轨迹</h2><p id="chart-caption" class="panel-caption"></p></div>
          <div class="chart-controls"><button id="reset-zoom" type="button" class="button button-secondary" hidden>恢复范围</button>
            <label class="compact-filter"><span class="visually-hidden">曲线时间范围</span><select id="curve-period"><option value="all">全部历史</option><option value="30">近 30 日</option><option value="7">近 7 日</option></select></label>
          </div>
        </div>
        <div id="rating-chart" class="rating-chart" aria-label="个人等级分历史曲线"></div>
      </section>
      <section class="panel matches-panel" aria-labelledby="matches-title">
        <div class="panel-heading"><div><h2 id="matches-title">近 30 日计分对局</h2><p id="recent-summary" class="panel-caption"></p></div>
          <label class="match-search"><span class="search-icon" aria-hidden="true"></span><input id="match-filter" type="search" placeholder="筛选赛事或对手" aria-label="筛选赛事或对手"></label>
        </div>
        <div id="match-list" class="match-list"></div>
        <div class="more-matches-wrap"><button id="more-matches" type="button" class="button button-secondary" hidden>查看更多对局</button></div>
      </section>
    </section>

    <section id="predictions-view" hidden></section>
    <section id="rules-view" class="rules-view" aria-labelledby="rules-title" hidden>
      <div class="rules-intro"><h1 id="rules-title">等级分规则</h1></div>
      <div id="rules-content" class="rules-content"></div>
    </section>
  </main>

  <footer class="site-footer"><div class="footer-inner"><span>♠ 新睿等级分</span><p id="footer-meta"></p></div></footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
