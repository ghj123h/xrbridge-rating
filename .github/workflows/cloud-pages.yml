name: Publish cloud rating data to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Cloud preparation job ID
        required: false
        type: string
      publication_version:
        description: Fixed successful cloud publication version
        required: false
        type: string
      prepare_mode:
        description: Prepare cloud data before downloading
        required: false
        default: none
        type: choice
        options: [none, release, buckets, validate]
      source_build_id:
        description: Optional isolated bucket build to finish in validate mode
        required: false
        type: string
  schedule:
    - cron: '45 18 * * *' # 02:45 Beijing time; publishes only a successful cloud snapshot.

permissions:
  contents: read

concurrency:
  group: cloud-rating-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.prepare_mode == 'release' || inputs.prepare_mode == 'buckets' || inputs.prepare_mode == 'validate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run independent cloud preparation job
        env:
          CLOUD_SITE_URL: ${{ vars.CLOUD_SITE_URL }}
          PUBLICATION_JOB_TOKEN: ${{ secrets.XR_PUBLICATION_JOB_TOKEN }}
          SITES_SERVICE_ACCESS_TOKEN: ${{ secrets.SITES_SERVICE_ACCESS_TOKEN }}
          CLOUD_JOB_ID: ${{ inputs.job_id }}
          CLOUD_PUBLICATION_VERSION: ${{ inputs.publication_version }}
          CLOUD_PREPARE_MODE: ${{ inputs.prepare_mode }}
          CLOUD_SOURCE_BUILD_ID: ${{ inputs.source_build_id }}
        run: |
          args=(--job-id "$CLOUD_JOB_ID" --version "$CLOUD_PUBLICATION_VERSION" --mode "$CLOUD_PREPARE_MODE")
          if [[ -n "$CLOUD_SOURCE_BUILD_ID" ]]; then
            args+=(--source-build-id "$CLOUD_SOURCE_BUILD_ID")
          fi
          python scripts/github-pages-cloud-job.py "${args[@]}"
  build:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') && inputs.prepare_mode != 'buckets' && inputs.prepare_mode != 'validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Separate build attempts; deploy-only retries reuse the recorded build output.
    outputs:
      pages_artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore public avatar packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/xr-public-avatar-packages
          key: xr-public-avatar-packages-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xr-public-avatar-packages-v1-${{ runner.os }}-
      - name: Download and verify prepared cloud release
        env:
          CLOUD_SITE_URL: ${{ vars.CLOUD_SITE_URL }}
          GITHUB_PUBLICATION_TOKEN: ${{ secrets.XR_PUBLICATION_TOKEN }}
          SITES_SERVICE_ACCESS_TOKEN: ${{ secrets.SITES_SERVICE_ACCESS_TOKEN }}
          PAGES_SOURCE_DIR: ${{ vars.PAGES_SOURCE_DIR || '.' }}
          CLOUD_PUBLICATION_VERSION: ${{ inputs.prepare_mode == 'release' && inputs.publication_version || '' }}
        run: |
          args=(--source-dir "$PAGES_SOURCE_DIR" --output-dir cloud-pages-output --avatar-cache-dir "$RUNNER_TEMP/xr-public-avatar-packages")
          if [[ -n "$CLOUD_PUBLICATION_VERSION" ]]; then
            args+=(--version "$CLOUD_PUBLICATION_VERSION")
          fi
          python scripts/github-pages-cloud-publish.py "${args[@]}"
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-pages-output
          include-hidden-files: true # Retain only the generated bundle's .nojekyll file.
  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete public bundle
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
